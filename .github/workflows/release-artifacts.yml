name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      macos_signing:
        description: macOS release-candidate signing mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - developer-id
  pull_request:
    paths:
      - ".github/workflows/release-artifacts.yml"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - "src/**"
      - "docs/release.md"
      - "README.md"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            bundles: dmg
            artifact_name: quotabar-macos-aarch64-dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact_name: quotabar-macos-x64-dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          - name: Windows
            runner: windows-2022
            bundles: msi,nsis
            artifact_name: quotabar-windows-installers
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/SHA256SUMS-windows.txt
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: appimage
            artifact_name: quotabar-linux-x64-appimage
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/SHA256SUMS.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check release manifest versions
        run: npm run release:check

      - name: Check product entrypoint manifest and guard fixtures
        run: |
          npm run release:entrypoint:check
          npm run test:release-entrypoint-guard

      - name: Prepare Developer ID signing and notarization
        if: runner.os == 'macOS' && inputs.macos_signing == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for variable_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER_SECRET \
            APPLE_API_KEY_SECRET \
            APPLE_API_PRIVATE_KEY
          do
            if [ -z "${!variable_name}" ]; then
              echo "Required signing secret is missing: ${variable_name}" >&2
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/quotabar-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/quotabar-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_SECRET}.p8"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          if [ -z "$signing_identity" ]; then
            echo "No Developer ID Application identity was imported" >&2
            exit 1
          fi

          {
            echo "APPLE_SIGNING_IDENTITY=$signing_identity"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
            echo "APPLE_API_KEY=$APPLE_API_KEY_SECRET"
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "QUOTABAR_SIGNING_KEYCHAIN=$keychain_path"
            echo "QUOTABAR_CERTIFICATE_PATH=$certificate_path"
            echo "QUOTABAR_API_KEY_PATH=$api_key_path"
          } >> "$GITHUB_ENV"

      - name: Build desktop bundle
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} -- --bin quotabar

      - name: Verify packaged product entrypoint on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -x src-tauri/target/release/quotabar
          test ! -e src-tauri/target/release/qbi_p1_r2_smoke

          if [ "$RUNNER_OS" = "macOS" ]; then
            dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
            if [ -z "$dmg_path" ]; then
              echo "Product DMG was not produced" >&2
              exit 1
            fi
            mount_point="$(mktemp -d "$RUNNER_TEMP/quotabar-entrypoint.XXXXXX")"
            cleanup_mount() {
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
              rmdir "$mount_point" 2>/dev/null || true
            }
            trap cleanup_mount EXIT
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path" >/dev/null
            app_path="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
            if [ -z "$app_path" ]; then
              echo "Product app bundle is missing from the DMG" >&2
              exit 1
            fi
            node scripts/check_product_entrypoint.mjs --bundle "$app_path"
          else
            appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
            if [ -z "$appimage_path" ]; then
              echo "Product AppImage was not produced" >&2
              exit 1
            fi
            appimage_path="$(realpath "$appimage_path")"
            extract_root="$(mktemp -d "$RUNNER_TEMP/quotabar-entrypoint.XXXXXX")"
            trap 'rm -rf "$extract_root"' EXIT
            (
              cd "$extract_root"
              "$appimage_path" --appimage-extract >/dev/null
            )
            test -x "$extract_root/squashfs-root/usr/bin/quotabar"
            if find "$extract_root/squashfs-root" -name 'qbi_p1_r2_smoke*' -print -quit | grep -q .; then
              echo "Task smoke binary leaked into the AppImage" >&2
              exit 1
            fi
          fi

      - name: Verify packaged product entrypoint on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $product = 'src-tauri/target/release/quotabar.exe'
          $smoke = 'src-tauri/target/release/qbi_p1_r2_smoke.exe'
          if (-not (Test-Path -LiteralPath $product)) {
            throw 'Product executable was not built'
          }
          if (Test-Path -LiteralPath $smoke) {
            throw 'Task smoke executable was built by the release command'
          }
          function Assert-InstallerEntrypoint($root, $kind) {
            $productEntries = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'quotabar.exe')
            if ($productEntries.Count -eq 0) {
              throw "Product executable is absent from $kind"
            }
            $smokeEntries = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'qbi_p1_r2_smoke.exe')
            if ($smokeEntries.Count -ne 0) {
              throw "Task smoke executable leaked into $kind"
            }
          }

          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File -ErrorAction Stop)
          if ($msi.Count -ne 1) {
            throw 'Expected exactly one MSI package'
          }
          $msiRoot = Join-Path $env:RUNNER_TEMP "quotabar-msi-entrypoint-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $msiRoot -ErrorAction Stop | Out-Null
          try {
            $process = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', $msi[0].FullName, '/qn', "TARGETDIR=$msiRoot") -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "MSI administrative extraction failed: exit $($process.ExitCode)"
            }
            Assert-InstallerEntrypoint $msiRoot 'the MSI package'
          } finally {
            Remove-Item -LiteralPath $msiRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          $nsis = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction Stop)
          if ($nsis.Count -ne 1) {
            throw 'Expected exactly one NSIS package'
          }
          $nsisRoot = Join-Path $env:RUNNER_TEMP "quotabar-nsis-entrypoint-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $nsisRoot -ErrorAction Stop | Out-Null
          try {
            & 7z x $nsis[0].FullName "-o$nsisRoot" -y | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to extract NSIS package: $($nsis[0].Name)"
            }
            Assert-InstallerEntrypoint $nsisRoot 'the NSIS package'
          } finally {
            Remove-Item -LiteralPath $nsisRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signed and notarized macOS app
        if: runner.os == 'macOS' && inputs.macos_signing == 'developer-id'
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "Signed macOS DMG was not produced" >&2
            exit 1
          fi

          mount_point="$(mktemp -d "$RUNNER_TEMP/quotabar-dmg.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path" >/dev/null

          app_path="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Signed macOS app bundle is missing from the DMG" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Generate Unix SHA-256 manifest
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            cd src-tauri/target/release/bundle/dmg
            shasum -a 256 ./*.dmg > SHA256SUMS.txt
          else
            cd src-tauri/target/release/bundle/appimage
            sha256sum ./*.AppImage > SHA256SUMS.txt
          fi

      - name: Generate Windows SHA-256 manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi'
            Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe'
          )
          if ($files.Count -eq 0) {
            throw 'No Windows installer was produced'
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content 'src-tauri/target/release/bundle/SHA256SUMS-windows.txt'

      - name: Remove temporary macOS signing material
        if: always() && runner.os == 'macOS' && inputs.macos_signing == 'developer-id'
        run: |
          if [ -n "${QUOTABAR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$QUOTABAR_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${QUOTABAR_CERTIFICATE_PATH:-}" \
            "${QUOTABAR_API_KEY_PATH:-}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
